submission:
  title: "TrialGuard - Real-Time Clinical Trial Protocol Deviation Monitor"
  problem_statement: >
    Clinical trials generate thousands of protocol deviations across hundreds of sites - missed
    visits, wrong doses, prohibited concomitant medications, late safety reports. Most go undetected
    until FDA audit, where a single rejected submission delays drug approval by 6-12 months and
    costs USD 50-100M.
  solution_summary: >
    TrialGuard is a hybrid rule + AI system that ingests patient visit, screening, and medication
    records, detects protocol deviations, classifies each deviation as Major, Minor, or Administrative
    per ICH E6(R2) using IBM watsonx.ai Granite, scores each site risk, and auto-drafts CAPA reports.
  key_features:
    - "Rule-based deviation detection across visit timing, dosing, prohibited medications, and required labs"
    - "ICH E6(R2) severity classification via watsonx.ai Granite with few-shot prompting"
    - "Site-level composite risk scoring with Red/Amber/Green banding"
    - "Auto-generated CAPA reports with Problem, Corrective Action, Preventive Action, Priority"
    - "Streamlit dashboard with site heatmap, deviation drill-down, and CAPA drafts"
    - "Rule engine validated against ground-truth deviation labels with precision and recall metrics"
  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "Pandas", "Pytest"]
    ibm_technologies: ["IBM Bob", "IBM watsonx.ai (Granite)"]
    databases: ["CSV (synthetic dataset)"]
    other: ["GitHub Actions"]
  what_we_are_most_proud_of: >
    Hybrid deterministic rule engine plus watsonx.ai Granite classification layer,
    validated against ground-truth deviation labels with real precision and recall metrics.
  known_limitations: >
    Built on synthetic data (500 patients, 10 sites, 4-visit protocol) rather than
    real clinical trial data. Runs locally via Streamlit, not deployed.

